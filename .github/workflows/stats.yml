# Every hour: redraws assets/stats.svg (GitHub contributions, streak, repositories, languages)
# and the typing / Root-Me pictures (assets/training.json, typing.svg, activity.svg, card-*.svg).
name: stats

on:
  schedule:
    - cron: "23 * * * *"   # every hour, off the round minute (GitHub drops busy-minute runs)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/stats.yml"]

permissions:
  contents: write

# one run at a time, so two runs never race to push
concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools
      - run: python3 scripts/make-stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/make-training.py
        env:
          ROOTME_API_KEY: ${{ secrets.ROOTME_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/training.json assets/typing.svg assets/activity.svg assets/card-typing.svg assets/card-rootme.svg
          git diff --cached --quiet || git commit -m "stats: redraw $(date -u +%F) [skip ci]"
          git pull --rebase origin main
          git push
